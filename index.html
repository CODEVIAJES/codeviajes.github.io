<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CODE Viajes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ea580c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CODE Viajes">
<meta name="robots" content="noindex, nofollow">
<style>
  html, body { margin: 0; height: 100%; background: #ea580c; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; display: none; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         color: #fff; text-align: center; padding: 24px; box-sizing: border-box; gap: 14px; font-weight: 700; }
  #msg img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  #msg input { width: 100%; max-width: 420px; padding: 12px; border-radius: 10px; border: 0; font-size: 15px; box-sizing: border-box; }
  #msg button { padding: 12px 22px; border-radius: 10px; border: 0; background: #7c2d12; color: #fff; font-weight: 700; font-size: 15px; }
  #msg small { font-weight: 400; opacity: .9; max-width: 420px; }
</style>
</head>
<body>
<div id="msg"><img src="icon-192.png" alt=""><div>CARGANDO CODE VIAJES…</div></div>
<iframe id="app" title="CODE Viajes" allow="clipboard-write"></iframe>
<script>
// CODE Viajes (PWA): esta pagina solo pone el icono y abre la app de Google dentro.
// La direccion de la app NO esta escrita aqui: llega una vez con el enlace de alta
// (…github.io/#AKfyc…) y se guarda en este movil.
(function () {
  var CLAVE = 'cv_app_id';
  var msg = document.getElementById('msg'), app = document.getElementById('app');
  function sacarId(t) { var m = String(t || '').match(/AKfyc[\w-]{20,}/); return m ? m[0] : ''; }
  function leerId() {
    var h = sacarId(location.hash);
    if (h) { try { localStorage.setItem(CLAVE, h); } catch (e) {} try { history.replaceState(null, '', location.pathname); } catch (e) {} return h; }
    try { return localStorage.getItem(CLAVE) || ''; } catch (e) { return ''; }
  }
  function pedirEnlace() {
    msg.innerHTML = '<img src="icon-192.png" alt=""><div>PRIMERA VEZ EN ESTE MÓVIL</div>' +
      '<small>Pega aquí el enlace de CODE Viajes que te ha pasado CODE (solo hace falta una vez).</small>' +
      '<input id="enl" placeholder="Pega el enlace aquí" autocomplete="off"><button id="ok">ENTRAR</button>';
    document.getElementById('ok').onclick = function () {
      var id = sacarId(document.getElementById('enl').value);
      if (!id) { alert('ESE ENLACE NO VALE'); return; }
      try { localStorage.setItem(CLAVE, id); } catch (e) {}
      abrir(id);
    };
  }
  function abrir(id) {
    var url = 'https://script.google.com/macros/s/' + id + '/exec';
    var listo = false;
    window.addEventListener('message', function (e) {
      if (!/(\.googleusercontent\.com|script\.google\.com)$/.test(String(e.origin || '').replace(/:\d+$/, ''))) return;
      var d = e.data || {};
      if (d.codeviajes === 'ok') { listo = true; app.style.display = 'block'; msg.style.display = 'none'; }
      if (d.codeviajes === 'recargar') { location.reload(); }
    });
    app.src = url;
    // Si en 20 s la app no ha dicho "estoy", seguramente Google pide iniciar sesion:
    // se abre la app de forma normal (fuera del marco) para poder entrar.
    setTimeout(function () { if (!listo) location.replace(url); }, 20000);
  }
  var id = leerId();
  if (id) abrir(id); else pedirEnlace();
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
</html>
